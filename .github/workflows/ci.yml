name: CI

# Builds the local-server Docker image (deployment/Dockerfile.local — the same
# image sevi-deploy's compose stack runs) and validates it: gate test scripts,
# then a live smoke test of the API with the committed models.
#
# Note: Render builds deployment/Dockerfile.render separately. Its pins
# (sklearn 1.3.2 / TF-less) predate the 2026-05 model retrains and cannot load
# the committed models — align requirements_render.txt with
# requirements_local.txt before relying on the NB/NN tiers in production.

on:
  push:
  workflow_dispatch:

concurrency:
  group: seviai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Response linter (P2-7)
        # Gates NEW style/contact-detail violations in data/cavsu_intents.json
        # against scripts/lint_responses_allowlist.json. Runs on the runner:
        # training/ and the allowlist ship in the checkout, not the image.
        run: |
          python3 -m pip install --quiet pydantic
          python3 scripts/lint_responses.py

      - name: Build image
        run: docker build -f deployment/Dockerfile.local -t sevi-api:ci .

      - name: Gate tests (safety + campus context)
        run: |
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_safety_gate.py
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_campus_context.py

      - name: Gate tests (lexical ranking + messenger gateway)
        # poc/now-priorities: ADR-002 stage B pooling contracts and the
        # Messenger webhook's signature/dedupe/disclosure/mapping contracts.
        # Both run fully offline inside the image.
        run: |
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_lexical_rank.py
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_messenger_gateway.py

      - name: Gate tests (reply language + which-college clarification)
        # The two UAT-driven reply controls. Model-free, so they run in seconds:
        # the language preference must beat detection in BOTH directions, and
        # every "which college?" chip must route back into the program list.
        run: |
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_reply_language.py

      - name: Gate tests (shorthand expansion + wayfinding)
        # Chat-shorthand expansion must stay whole-token and idempotent (a
        # substring pass makes "prerequisite" -> "prerequirementuisite"), the
        # charter quote floor must stay above the measured 0.1211 false quote,
        # and "how to get A THING" must not resolve as wayfinding.
        run: |
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_shorthand_expansion.py
          docker run --rm -e LLM_PROVIDER=none sevi-api:ci python test_place_resolver.py

      - name: Start API
        run: docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=none sevi-api:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "API never became healthy" >&2
          exit 1

      - name: Smoke test — classifier + NB-tier chat
        run: |
          set -euo pipefail

          health=$(curl -fsS http://localhost:8000/health)
          echo "health: $health"
          # Public /health is deliberately minimal since P0-3 (classifier/LLM
          # detail moved behind the admin PIN at /admin/status) — asserting
          # more here would reintroduce the information leak the trim removed.
          echo "$health" | jq -e '.status == "healthy"'

          chat=$(curl -fsS -X POST http://localhost:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"Hello DIWA"}')
          echo "chat: $chat"
          # A deterministic tier (retrieval / NB / NN) must answer the greeting,
          # not the LLM fallback or a refusal — CI runs with LLM_PROVIDER=none.
          echo "$chat" | jq -e '.intent == "greeting" and (.source | test("intent_retrieval|naive_bayes|neural_network"))'

          chat=$(curl -fsS -X POST http://localhost:8000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"How do I enroll at CvSU?"}')
          echo "$chat" | jq -e '.intent == "enrollment_procedure"'

      - name: Gold eval (P1-4) — regression floor
        # Full 100-item gold set against the running container. LLM_PROVIDER
        # is none in CI, so this measures the deterministic tiers. The
        # handoff's target thresholds are 0.85 / 0.10; the flags below are the
        # floor measured 2026-08-04 (acc 0.569, OOS 0.000) — they gate against
        # REGRESSION today. Ratchet them toward the targets as retrains land.
        run: >
          python3 training/run_gold_eval.py
          --base-url http://localhost:8000
          --min-accuracy 0.55 --max-oos-accept 0.05

      - name: Dump logs on failure
        if: failure()
        run: docker logs api || true

      - name: Cleanup
        if: always()
        run: docker rm -f api || true
